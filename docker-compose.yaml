services:
  prod:
    image: prod_image
    build:
      context: simple-document-service
      dockerfile: Dockerfile
    container_name: prod_container
    volumes:
      - ./simple-document-service:/usr/src/simple-document-service
    env_file:
      - .env
    ports:
      - "1337:8000"
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
    labels:
      - "autoheal=true"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/$UUID_TEST_CHECK"]
      interval: 60s
      timeout: 10s
      retries: 1
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: 1
#              capabilities: [gpu]
  test:
    image: test_image
    build:
      context: simple-document-service
      dockerfile: Dockerfile
    volumes:
      - ./simple-document-service:/usr/src/simple-document-service
    container_name: test_container
    command: >
      sh -c "pytest -v -s ./tests"
    restart: no

  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
